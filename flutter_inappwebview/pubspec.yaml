name: flutter_inappwebview_kontext
description: Kontext-maintained fork of the Flutter InAppWebView umbrella package for Android and iOS.
version: 6.1.5+1.kontext.0
homepage: https://github.com/kontextso/flutter_inappwebview
repository: https://github.com/kontextso/flutter_inappwebview/tree/kontext-develop/flutter_inappwebview
issue_tracker: https://github.com/kontextso/flutter_inappwebview/issues
funding:
  - https://inappwebview.dev/donate/
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface_kontext:
    path: ../flutter_inappwebview_platform_interface/
  flutter_inappwebview_android_kontext:
    path: ../flutter_inappwebview_android/
  flutter_inappwebview_ios_kontext:
    path: ../flutter_inappwebview_ios/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_inappwebview_android_kontext
      ios:
        default_package: flutter_inappwebview_ios_kontext

  assets:
    - packages/flutter_inappwebview_kontext/assets/t_rex_runner/t-rex.html
    - packages/flutter_inappwebview_kontext/assets/t_rex_runner/t-rex.css
  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.io/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.io/custom-fonts/#from-packages

false_secrets:
  - /test_node_server/*.pem
  - /test_node_server/*.pfx
